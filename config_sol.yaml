underlying: SOL

# SOL_USDC linear options (#837, decided on #117): USDC-settled, so premiums,
# fees, margin and P&L are in USDC. No DVOL for SOL: the IV bands read the
# chain's 30-day ATM IV and stay at the lowest band until 90 daily closes
# exist (#834). The futures hedge starts on at the bot's first start (#836).
# Only the settings that are tuned live here; everything else is fixed in
# internal/config/fixed.go, and setting one of those keys fails at startup.

# ── Entry slots ───────────────────────────────────────────────────────────────
# Deribit lists only month- and quarter-ends beyond two weeks for SOL, so each
# slot's ±10-day window (20–40, 40–60) always holds an expiry.
dte_delta_matrix:
  - dte: 30
    deltas: [0.16]
  - dte: 50
    deltas: [0.16]

# ── Rollout & risk rules (as BTC's) ───────────────────────────────────────────
rollout_dte:            15      # roll entire strangle when DTE ≤ this
delta_drift_threshold:  0.10    # roll a leg when |delta| falls below this (little premium left); at most 75% of every entry delta
roi_take_profit:        0.50    # roll leg when ROI ≥ 50% of premium received
stop_loss_multiplier:   2.0     # emergency close when loss ≥ 2× premium received
delta_exit_threshold:   0.30    # close a short leg when |delta| reaches this (the move is real); re-sold only once calm, like a stop
repair_cooldown_hours:  72      # a stopped-out leg is re-sold no sooner than this, and only when entries are not frozen and the confirmed gamma regime is not negative

# ── Gamma monitor (GEX from the SOL_USDC book, dollar gamma) ──────────────────
gamma_flip_buffer_sd:      1.5  # shed a leg only when spot is this many daily std devs (chain IV/sqrt(365)) beyond the gamma flip
gex_direction:             sma  # side to avoid in a negative regime: sma (SMA trend) | bias (spot vs flip ± the buffer)

# ── Margin policy (all figures are Deribit's: % of the USDC margin balance) ──
iv_margin_bands:
  - { min_iv_pct: 70, max_im_pct: 50 }
  - { min_iv_pct: 30, max_im_pct: 35 }
  - { min_iv_pct: 0,  max_im_pct: 20 }
max_mm_pct:             35      # maintenance-margin limit, enforced at once (Deribit liquidates at 100)
max_leg_size_multiple:  2       # a new leg is at most 2x its slot's normal size (share / standalone margin per lot)

# ── Entry ─────────────────────────────────────────────────────────────────────
min_premium:           0.07     # minimum premium per leg, in USDC per SOL (~0.1 % of spot, as BTC's 0.001 BTC); 0 = accept any premium

# ── Backtest ──────────────────────────────────────────────────────────────────
backtest:
  fill_model:               mid       # mid | bid_ask | slippage
  slippage_pct:             0.001
  limit_fill_rule:          next_tick
  commission_per_contract:  0.0003
  margin_call_liquidation:  true
