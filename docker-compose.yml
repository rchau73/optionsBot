services:
  bot-btc:
    build: .
    restart: unless-stopped
    volumes:
      # Each service maps its own host config file to /app/config.yaml inside
      # the container — the bot binary always reads that fixed path.
      - ./.env:/app/.env:ro
      - ./config_btc.yaml:/app/config.yaml:ro
      # Separate data/ directories so logs and state don't collide.
      - ./data/btc:/app/data
    environment:
      - TZ=America/Sao_Paulo
      # Read-only monitor API, reachable only on the compose network (not published).
      - BOT_API_ADDR=:8081

  bot-eth:
    build: .
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      - ./config_eth.yaml:/app/config.yaml:ro
      - ./data/eth:/app/data
    environment:
      - TZ=America/Sao_Paulo
      - BOT_API_ADDR=:8082

  # Live monitor UI: http://localhost:3000 (bound to this machine only).
  monitor:
    build: ./frontend
    restart: unless-stopped
    depends_on: [bot-btc, bot-eth]
    environment:
      - BOT_APIS=btc=http://bot-btc:8081,eth=http://bot-eth:8082
      - MONITOR_POLL_MS=1000   # page refresh; polling never touches Deribit rate limits
    ports:
      - "127.0.0.1:3000:3000"
