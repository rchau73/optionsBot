# One stack per local environment — run it only through scripts/envctl.sh
# <stable|mvp>, which reads the clone's .env (its own Deribit account) and
# deploy.env (OPTIONSBOT_ENV, MONITOR_PORT, BOT_RECORD_MARKET) and sets
# BOT_VERSION. A plain `docker compose up` refuses: the dev checkout runs nothing.
name: optionsbot-${OPTIONSBOT_ENV:?run the stack with scripts/envctl.sh stable|mvp}

x-bot-env: &bot-env
  TZ: America/Sao_Paulo
  BOT_DEPLOYMENT: ${OPTIONSBOT_ENV}
  BOT_VERSION: ${BOT_VERSION:-}
  BOT_RECORD_MARKET: ${BOT_RECORD_MARKET:-1}

services:
  # One bot per underlying. Each runs in its own host folder (data/btc,
  # data/eth): bot.log, orders.log (decision journal), hedge_report.json and
  # data/ (P&L and gamma-regime history) persist there across rebuilds, and the
  # two bots never write the same file. Config and .env are mounted read-only.
  bot-btc:
    build: .
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--env-file", "/app/.env"]
    volumes:
      - ./.env:/app/.env:ro
      # BOT_CONFIG_BTC (an environment's deploy.env) picks another BTC config: mvp
      # runs config_btc.mvp.yaml (#168: direction sma vs stable's bias).
      - ${BOT_CONFIG_BTC:-./config_btc.yaml}:/app/config.yaml:ro
      - ./data/btc:/app/run
    environment:
      <<: *bot-env
      # Read-only monitor API, reachable only on the compose network (not published).
      BOT_API_ADDR: ":8081"

  bot-eth:
    build: .
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--env-file", "/app/.env"]
    volumes:
      - ./.env:/app/.env:ro
      - ./config_eth.yaml:/app/config.yaml:ro
      - ./data/eth:/app/run
    environment:
      <<: *bot-env
      BOT_API_ADDR: ":8082"

  # Live monitor UI on this machine only: stable http://localhost:3000, mvp :3100.
  monitor:
    build: ./frontend
    restart: unless-stopped
    depends_on: [bot-btc, bot-eth]
    environment:
      - BOT_APIS=btc=http://bot-btc:8081,eth=http://bot-eth:8082
      - MONITOR_POLL_MS=1000   # page refresh; polling never touches Deribit rate limits
      # Manual close (testnet): the monitor's proxy adds it; the browser never sees it. From .env.
      - BOT_ADMIN_TOKEN=${BOT_ADMIN_TOKEN:-}
      # Sign-in (frontend/README.md "Sign-in"), from .env. The monitor refuses to
      # start without AUTH_SECRET (≥ 32 bytes); ADMIN_* create the first admin
      # when there are no users; MONITOR_API_TOKEN lets the deploy health check
      # and the agents read bot data (GET only) without a session.
      - AUTH_SECRET=${AUTH_SECRET:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - MONITOR_API_TOKEN=${MONITOR_API_TOKEN:-}
      # Analytics (#193): events.jsonl beside auth.db, only with consent and a
      # salt; the deployment and version tag each event (no account, no amount).
      - ANALYTICS_SALT=${ANALYTICS_SALT:-}
      - MONITOR_DEPLOYMENT=${OPTIONSBOT_ENV}
      - MONITOR_VERSION=${BOT_VERSION:-}
      # Help assistant (#191, frontend/README.md "Assistant"): off while empty;
      # its review log is assistant.jsonl beside auth.db.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Users and sessions (auth.db), analytics events (events.jsonl). A named
      # volume: one per environment, as the compose project name includes OPTIONSBOT_ENV.
      - monitor-auth:/app/data/monitor
      # The weekly usage reports cmd/usage writes in each environment's clone
      # (usage.sh), read-only for the admin Analytics page (#445): counts only,
      # no id. The clones are siblings (<envs>/stable, <envs>/mvp).
      - ../stable/data/monitor/reports:/app/data/reports/stable:ro
      - ../mvp/data/monitor/reports:/app/data/reports/mvp:ro
      # The delivery report cmd/dora writes daily (dora.sh, #470) beside the
      # environments' shared history, read-only for the Analytics page's
      # Delivery (DORA) topic (#473): git and deploy times only, no account data.
      - ../history/delivery:/app/data/delivery:ro
    ports:
      - "127.0.0.1:${MONITOR_PORT:?set MONITOR_PORT in deploy.env}:3000"

volumes:
  monitor-auth:
