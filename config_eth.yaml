underlying: ETH

# ── Entry slots ───────────────────────────────────────────────────────────────
# Each (dte, delta) pair is an independent strangle slot.
# Budget is split equally: qty per order = margin_budget ÷ total_slots.
dte_delta_matrix:
  - dte: 25
    deltas: [0.16]
  - dte: 45
    deltas: [0.16]
  - dte: 60
    deltas: [0.18]

# Legacy fields — ignored when dte_delta_matrix is set; kept for backtest sweeps.
target_dte:   []
entry_delta:  0.0

# ── Rollout & risk rules ──────────────────────────────────────────────────────
rollout_dte:            15      # roll entire strangle when DTE ≤ this
delta_drift_threshold:  0.10    # roll a leg when |delta| falls below this (little premium left)
roi_take_profit:        0.50    # roll leg when ROI ≥ 50% of premium received
stop_loss_multiplier:   2.0     # emergency close when loss ≥ 2× premium received

# ── Gamma monitor ─────────────────────────────────────────────────────────────
gamma_trend_lookback_days: 120
swing_pivot_n:             5    # bars required on each side to confirm a swing pivot
gamma_regime_band_pct:     0.025 # hysteresis band around the gamma flip; spot must cross flip±band to switch regime
gex_strike_range_pct:      0.25 # GEX inputs: only strikes within ±25% of spot; 0 = include all strikes

# ── IV & margin ───────────────────────────────────────────────────────────────
iv_percentile_window:   252     # days of DVOL history the IV percentile ranks against
hedge_report_threshold: 0.05    # net delta threshold that triggers hedge_report.json
max_margin_pct:         0.35    # share of equity usable as PM initial margin (× leverage)
leverage:               4.0     # multiplier on the margin budget (e.g. 2 = 2× the allowed margin)
max_leverage:           10.0    # hard cap; leverage above this is rejected at startup

# ── Order execution ───────────────────────────────────────────────────────────
eval_interval_ms:      40000    # how often the strategy evaluates open positions
report_interval_sec:   60       # heartbeat and P&L journal line every N seconds
max_dte_deviation:     10       # max days an expiry may differ from the target DTE
delta_slippage:        0.03     # max delta distance from target; 0 = accept closest
min_trade_amount:      0.1      # minimum BTC per order leg (Deribit minimum)
min_premium_btc:       0.001    # minimum premium per leg in BTC; 0 = accept any premium
order_fill_timeout_sec: 90      # cancel and resubmit at fresh market price after this many seconds
order_slippage_pct:    0.05     # amend price if ask drifts more than this % from limit
order_max_adjustments: 3        # max price amendments before giving up on a limit order
spread_alert_threshold: 0.05    # log a warning when bid/ask spread exceeds 5%

# ── Backtest ──────────────────────────────────────────────────────────────────
backtest:
  fill_model:               mid       # mid | bid_ask | slippage
  slippage_pct:             0.001
  limit_fill_rule:          next_tick
  commission_per_contract:  0.0003
  margin_call_liquidation:  true
