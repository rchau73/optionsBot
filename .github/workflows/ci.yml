name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Which jobs a change needs (#429): a pull request that only touches the
  # frontend skips the Go jobs — except the frontend files the Go tests read
  # (content/, README.md, the analytics and assistant twins). A push to main
  # always runs everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          go=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE...$HEAD")
            echo "$files"
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '^frontend/' &&
               ! echo "$files" | grep -qE '^frontend/(content/|README\.md$|lib/analytics/|lib/assistant/)'; then
              go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Go jobs: $go"

  go-lint:
    name: Go lint & scripts
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3" # pinned: govulncheck GO-2026-6809 (crypto/x509, fixed in 1.27.3, 2026-10-22); bump on each stdlib advisory
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal tests)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Shell scripts (bash -n, shellcheck)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version
          REQUIRE_SHELLCHECK=1 bash scripts/check_shell.sh

      - name: Agent scripts (PM board rules)
        run: python3 -m unittest discover -s scripts/agents -p 'test_*.py'

      - name: Docs scripts (one sentence per line, reflow tool)
        run: python3 -m unittest discover -s scripts/docs -p 'test_*.py'

      - name: Product scripts (unit economics)
        run: python3 -m unittest discover -s scripts/product -p 'test_*.py'

  # The suite in two groups run in parallel (scripts/go_tests.sh, #429): the
  # core under the race detector, the single-goroutine report and research
  # tests without it (the nightly flaky hunt runs everything with -race).
  go-tests:
    name: "Go tests: ${{ matrix.group }}"
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, reports]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Tests (${{ matrix.group }}, coverage)
        run: bash scripts/go_tests.sh ${{ matrix.group }} coverage-${{ matrix.group }}.out

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.group }}
          path: coverage-${{ matrix.group }}.out

  # The required check: the Go jobs passed and the merged coverage holds its
  # floor; a frontend-only pull request passes it without them.
  test:
    name: Lint, test & coverage
    needs: [changes, go-lint, go-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Go jobs
        env:
          GO: ${{ needs.changes.outputs.go }}
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.go-lint.result }}
          TESTS: ${{ needs.go-tests.result }}
        run: |
          echo "changes $CHANGES · go $GO · lint $LINT · tests $TESTS"
          [ "$CHANGES" = "success" ] || exit 1
          if [ "$GO" != "true" ]; then
            echo "### Frontend-only change: Go jobs skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$LINT" = "success" ] && [ "$TESTS" = "success" ]

      - uses: actions/checkout@v4
        if: needs.changes.outputs.go == 'true'

      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.go == 'true'
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Coverage summary
        if: needs.changes.outputs.go == 'true'
        run: |
          bash scripts/go_tests.sh merge coverage.out coverage-core.out coverage-reports.out
          bash scripts/check_cover.sh --profile coverage.out | tee cover.txt
          echo "### $(tail -1 cover.txt)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.go == 'true'
        with:
          name: coverage
          path: coverage.out

  frontend:
    name: Frontend lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit, not just the last
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t optionsbot:ci .
      - run: docker build -t optionsbot-monitor:ci ./frontend
