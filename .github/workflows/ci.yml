name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * *" # nightly: every job on main, the vulnerability scan included (#472)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which jobs a pull request needs (#429, #472): scripts/agents/checkfail.py
  # suites picks them by what each one builds or reads — a doc runs a suite
  # only when one of its tests opens it (test_checkfail.py keeps that list
  # honest), any .md runs the doc-wide line checks (a CLAUDE.md only those), Docker only on code, the
  # vulnerability scan only on go.mod/go.sum/package-lock.json. A push to
  # main, the nightly run and a manual run always run everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
      go_lint: ${{ steps.diff.outputs.go_lint }}
      frontend: ${{ steps.diff.outputs.frontend }}
      docs: ${{ steps.diff.outputs.docs }}
      scripts: ${{ steps.diff.outputs.scripts }}
      docker: ${{ steps.diff.outputs.docker }}
      vuln: ${{ steps.diff.outputs.vuln }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE...$HEAD" > files.txt
            cat files.txt
            python3 scripts/agents/checkfail.py suites files.txt | tee -a "$GITHUB_OUTPUT"
          else
            for s in go go_lint frontend docs scripts docker vuln; do echo "$s=true"; done | tee -a "$GITHUB_OUTPUT"
          fi

  go-lint:
    name: Go lint
    needs: changes
    if: needs.changes.outputs.go_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3" # pinned: govulncheck GO-2026-6809 (crypto/x509, fixed in 1.27.3, 2026-10-22); bump on each stdlib advisory
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal tests)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

  # Split from Go lint (#472): a scripts-only change needs no go vet.
  scripts:
    name: Scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5 # test_backup.py builds cmd/backupcheck
        with:
          go-version: "1.27.3"
          cache: true

      - name: Shell scripts (bash -n, shellcheck)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version
          REQUIRE_SHELLCHECK=1 bash scripts/check_shell.sh

      - name: Agent scripts (PM board rules)
        run: python3 -m unittest discover -s scripts/agents -p 'test_*.py'

      - name: Docs scripts (one sentence per line, reflow tool)
        run: python3 -m unittest discover -s scripts/docs -p 'test_*.py'

      - name: Product scripts (unit economics)
        run: python3 -m unittest discover -s scripts/product -p 'test_*.py'

  # The suite in two groups run in parallel (scripts/go_tests.sh, #429): the
  # core under the race detector, the single-goroutine report and research
  # tests without it (the nightly flaky hunt runs everything with -race).
  go-tests:
    name: "Go tests: ${{ matrix.group }}"
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, reports]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Tests (${{ matrix.group }}, coverage)
        run: bash scripts/go_tests.sh ${{ matrix.group }} coverage-${{ matrix.group }}.out

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.group }}
          path: coverage-${{ matrix.group }}.out

  # The required check: every job the change needs passed, and the merged
  # coverage holds its floor; a job the change does not need is skipped. A
  # docs-only change runs the doc-wide line checks here.
  test:
    name: Lint, test & coverage
    needs: [changes, go-lint, scripts, go-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Jobs the change needs
        env:
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.changes.outputs.go }}
          GO_LINT: ${{ needs.changes.outputs.go_lint }}
          SCRIPTS: ${{ needs.changes.outputs.scripts }}
          LINT: ${{ needs.go-lint.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
          TESTS: ${{ needs.go-tests.result }}
        run: |
          echo "changes $CHANGES · go $GO ($TESTS) · go lint $GO_LINT ($LINT) · scripts $SCRIPTS ($SCRIPTS_RESULT)"
          [ "$CHANGES" = "success" ] || exit 1
          ok=0
          [ "$GO" != "true" ] || [ "$TESTS" = "success" ] || ok=1
          [ "$GO_LINT" != "true" ] || [ "$LINT" = "success" ] || ok=1
          [ "$SCRIPTS" != "true" ] || [ "$SCRIPTS_RESULT" = "success" ] || ok=1
          [ "$GO" = "true" ] || echo "### Go tests skipped: the change touches nothing they build or read" >> "$GITHUB_STEP_SUMMARY"
          exit $ok

      - uses: actions/checkout@v4
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.docs == 'true'

      - uses: actions/setup-go@v5
        if: needs.changes.outputs.go != 'true' && needs.changes.outputs.docs == 'true'
        with:
          go-version: "1.27.3"
          cache: true

      - name: Doc checks (a docs-only change; checkfail.py DOC_TESTS_RUN)
        if: needs.changes.outputs.go != 'true' && needs.changes.outputs.docs == 'true'
        run: go test ./tests/ -count=1 -run '^(TestClaudeDocs|TestDocs_)'

      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.go == 'true'
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Coverage summary
        if: needs.changes.outputs.go == 'true'
        run: |
          bash scripts/go_tests.sh merge coverage.out coverage-core.out coverage-reports.out
          bash scripts/check_cover.sh --profile coverage.out | tee cover.txt
          echo "### $(tail -1 cover.txt)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.go == 'true'
        with:
          name: coverage
          path: coverage.out

  frontend:
    name: Frontend lint, test & build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' # skipped counts as passed for the required check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit, not just the last
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vulncheck:
    name: Vulnerability scan
    needs: changes
    if: needs.changes.outputs.vuln == 'true' # dependency files; every push to main and nightly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker build
    needs: changes
    if: needs.changes.outputs.docker == 'true' # Dockerfile, go.*, cmd/, internal/, frontend code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t optionsbot:ci .
      - run: docker build -t optionsbot-monitor:ci ./frontend
