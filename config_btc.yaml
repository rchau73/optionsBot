underlying: BTC

# ── Entry slots ───────────────────────────────────────────────────────────────
# Each (dte, delta) pair is an independent strangle slot.
# Each slot gets an equal share of the margin policy's IM limit (see below).
dte_delta_matrix:
  - dte: 25
    deltas: [0.16]
  - dte: 45
    deltas: [0.16]
  - dte: 60
    deltas: [0.18]

# Legacy fields — ignored when dte_delta_matrix is set; kept for backtest sweeps.
target_dte:   []
entry_delta:  0.0

# ── Rollout & risk rules ──────────────────────────────────────────────────────
rollout_dte:            15      # roll entire strangle when DTE ≤ this
delta_drift_threshold:  0.10    # roll a leg when |delta| falls below this (little premium left); at most 75% of every entry delta
roi_take_profit:        0.50    # roll leg when ROI ≥ 50% of premium received
stop_loss_multiplier:   2.0     # emergency close when loss ≥ 2× premium received
delta_exit_threshold:   0.30    # close a short leg when |delta| reaches this (the move is real); re-sold only once calm, like a stop
repair_cooldown_hours:  72      # a stopped-out leg is re-sold no sooner than this, and only when entries are not frozen and the confirmed gamma regime is not negative

# ── Gamma monitor ─────────────────────────────────────────────────────────────
gamma_trend_lookback_days: 120
swing_pivot_n:             5    # bars required on each side to confirm a swing pivot
gex_method:                script # script = GestaoCarteira deribit_tc_export_v3.py rules (regime = sign of weighted GEX, flip = lowest crossing); nearest_flip = spot vs nearest flip, with hysteresis
gex_strike_range_pct:      0.15 # GEX inputs: only strikes within ±15% of each expiry's underlying (as the script); 0 = all strikes
gamma_regime_band_pct:     0.025 # nearest_flip only: hysteresis band around the gamma flip

# ── IV & margin ───────────────────────────────────────────────────────────────
iv_percentile_window:   252     # days of DVOL history the IV percentile ranks against
hedge_report_threshold: 0.05    # net delta threshold that triggers hedge_report.json

# ── Margin policy (all figures are Deribit's: % of margin balance) ────────────
# Initial-margin limit by DVOL IV-percentile band: rich premium allows more,
# calm markets (a big move may be coming) allow less. A confirmed negative
# gamma regime forces the lowest band. Band/regime changes must hold for
# iv_band_confirm_days daily closes; until then new entries are frozen.
iv_margin_bands:
  - { min_iv_pct: 70, max_im_pct: 50 }
  - { min_iv_pct: 30, max_im_pct: 35 }
  - { min_iv_pct: 0,  max_im_pct: 20 }
iv_band_confirm_days:   2
max_mm_pct:             35      # maintenance-margin limit, enforced at once (Deribit liquidates at 100)
max_leg_size_multiple:  2       # a new leg is at most 2x its slot's normal size (share / standalone margin per lot); stops book offsets from inflating sizes

# ── Order execution ───────────────────────────────────────────────────────────
eval_interval_ms:      40000    # how often the strategy evaluates open positions
report_interval_sec:   60       # heartbeat and P&L journal line every N seconds
max_dte_deviation:     10       # max days an expiry may differ from the target DTE
expiry_stretch:        1.5      # slots keep separate expiries: if another slot holds a slot's expiry, it takes the nearest free one up to target DTE x this, else waits
delta_slippage:        0.03     # max delta distance from target; 0 = accept closest
min_trade_amount:      0.1      # minimum BTC per order leg (Deribit minimum)
min_premium_btc:       0.001    # minimum premium per leg in BTC; 0 = accept any premium
order_fill_timeout_sec: 90      # cancel and resubmit at fresh market price after this many seconds
order_slippage_pct:    0.05     # amend price if ask drifts more than this % from limit
order_max_adjustments: 3        # max price amendments before giving up on a limit order
spread_alert_threshold: 0.05    # log a warning when bid/ask spread exceeds 5%

# ── Backtest ──────────────────────────────────────────────────────────────────
backtest:
  fill_model:               mid       # mid | bid_ask | slippage
  slippage_pct:             0.001
  limit_fill_rule:          next_tick
  commission_per_contract:  0.0003
  margin_call_liquidation:  true
